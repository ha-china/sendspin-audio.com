name: Sync upstream and translate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-translate
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout Chinese branch
        uses: actions/checkout@v4
        with:
          ref: Chinese
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Sendspin/sendspin-audio.com.git
          git fetch upstream main
          git config user.name "translate-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream
        run: |
          set -e
          PRE=$(git rev-parse HEAD)
          UP=$(git rev-parse upstream/main)
          if ! git merge upstream/main -X theirs --no-edit -m "Sync from upstream $UP"; then
            echo "::warning::-X theirs only settles content conflicts; resolving the rest in favour of upstream"
            # Typical leftovers are modify/delete pairs (upstream removed a
            # file we had translated): follow upstream — take its version,
            # or delete when it deleted.
            git diff --name-only --diff-filter=U -z |
              while IFS= read -r -d '' path; do
                if git cat-file -e "upstream/main:$path" 2>/dev/null; then
                  git checkout upstream/main -- "$path"
                  git add -- "$path"
                  echo "took upstream version: $path"
                else
                  git rm -q -f -- "$path"
                  echo "deleted as upstream: $path"
                fi
              done
            git commit --no-edit
          fi
          # The GITHUB_TOKEN cannot push workflow files ("workflows"
          # permission is not grantable), so keep our workflows exactly as
          # they were before the merge and fold that into the merge commit.
          if ! git diff --quiet "$PRE" HEAD -- .github/workflows; then
            # checkout alone cannot drop files upstream ADDED (they are not
            # in $PRE); remove those first, then restore our set exactly.
            git diff --name-only --diff-filter=ACMR -z "$PRE" HEAD -- .github/workflows |
              while IFS= read -r -d '' f; do git rm -q -f -- "$f" || true; done
            git checkout "$PRE" -- .github/workflows
            git commit --amend --no-edit
          fi
          echo "UPSTREAM_SHA=$UP" >> "$GITHUB_ENV"

      # -X theirs takes the upstream side of the templates, which resets the
      # Chinese labels of the navigation and the footer. The script is
      # idempotent: it re-applies the labels of our Chinese branch.
      - name: Re-apply Chinese chrome
        run: node scripts/ensure-chinese.mjs

      - name: List changed content files
        id: files
        run: |
          UP=$(git rev-parse upstream/main)
          if [ -f .github/translation/last-sync-sha.txt ]; then
            LAST="$(cat .github/translation/last-sync-sha.txt)"
          else
            LAST=""
          fi
          if [ -z "$LAST" ]; then
            FILES=$(git ls-files -c 'src/**/*.md' 'src/*.md' | grep -v '^src/index\.md$' || true)
          elif [ "$LAST" = "$UP" ]; then
            echo "No upstream changes since last sync"
            FILES=""
          else
            FILES=$(git diff --name-only --diff-filter=ACMRT "$LAST" "$UP" -- 'src/**/*.md' 'src/*.md' || true)
          fi
          { echo 'files<<EOF'; echo "$FILES"; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "Last sync sha: ${LAST:-<none, full translation>}"
          echo "Files to translate:"; echo "$FILES"

      - name: Translate
        if: steps.files.outputs.files != ''
        run: node scripts/translate-upstream.mjs
        env:
          FILE_LIST: ${{ steps.files.outputs.files }}

      - name: Persist last-sync commit
        run: |
          mkdir -p .github/translation
          echo "$UPSTREAM_SHA" > .github/translation/last-sync-sha.txt

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Translate content from upstream $UPSTREAM_SHA"
            git push origin Chinese
          fi

      # Build the site and publish the static output to a `build` branch that
      # only ever holds the latest build (a single orphan commit), so the
      # files can be downloaded from GitHub and uploaded to the server as-is.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Publish build branch
        run: |
          set -e
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -a dist/sendspin/. "$SITE/"
          git config user.name "translate-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan build
          git reset -q
          # Clear the working tree, then put the built site at the branch root.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SITE"/. .
          git add -A -f
          git commit -q -m "Site build of ${GITHUB_SHA::7}"
          git push -q --force origin build
          echo "Published to the build branch"
